name: Docker CI/CD hello-spring-action

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GOOGLE_CLOUD_PROJECT: "cnsa2026-pgr866"
  APP_NAME: "hello-spring-action"
  REPO_NAME: "docker-repo"
  REPO_LOCATION: "us-east1"
  IMAGE_NAME: "us-east1-docker.pkg.dev/cnsa2026-pgr866/docker-repo/hello-spring-action"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: pgr866/hello-spring-action
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ env.REPO_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.run_id }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.run_id }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.run_id }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'

      - name: Adding Known Hosts
        run: |
          sudo echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf > /dev/null
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VM
        run: |
          ssh ubuntu@${{ secrets.SSH_HOST }} << 'EOF'
            echo '${{ secrets.GCP_SA_KEY }}' | docker login -u _json_key --password-stdin https://${{ env.REPO_LOCATION }}-docker.pkg.dev
            docker stop ${{ env.APP_NAME }} || true
            docker rm -fv ${{ env.APP_NAME }} || true
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker run -d -p 8080:8080 --name ${{ env.APP_NAME }} ${{ env.IMAGE_NAME }}:latest
          EOF
